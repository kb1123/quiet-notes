name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk QuietNotes-1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quiet Notes 1.0.${{ github.run_number }}
          body: |
            Download **QuietNotes-1.0.${{ github.run_number }}.apk** below and open it on your phone.
            Built automatically from commit ${{ github.sha }}.
          files: QuietNotes-1.0.${{ github.run_number }}.apk
          make_latest: true
