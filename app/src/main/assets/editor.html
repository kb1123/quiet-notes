<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1d; --muted: #6b6b6b; --line: #c9c9c9;
    --bar: #f3f1ec; --btn: #ffffff; --btn-on: #2f5d50; --btn-on-fg: #ffffff; --th: #f0ede6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --fg: #e9e9e9; --muted: #9a9a9a; --line: #4a4a4a;
      --bar: #1e1e1e; --btn: #2a2a2a; --btn-on: #6fae9b; --btn-on-fg: #0d0d0d; --th: #262626;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body { font-size: var(--size, 16px); line-height: 1.5; font-family: var(--font, system-ui, Roboto, sans-serif); }

  #bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 10px; background: var(--bar); border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  #bar::-webkit-scrollbar { display: none; }
  #bar button {
    flex: 0 0 auto; min-width: 40px; height: 38px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--btn); color: var(--fg); font: 600 15px system-ui, Roboto, sans-serif;
  }
  #bar button.on { background: var(--btn-on); color: var(--btn-on-fg); border-color: var(--btn-on); }
  #bar .sep { flex: 0 0 1px; background: var(--line); margin: 4px 2px; }

  #ed, #src {
    display: block; box-sizing: border-box; width: 100%;
    min-height: calc(100vh - 56px); padding: 12px 16px 40vh; outline: none;
  }
  #ed:empty::before { content: "Start writing… use the toolbar for headings, lists, tables and images."; color: var(--muted); }
  #src {
    display: none; border: 0; resize: none; background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-monospace, monospace;
  }
  body.source #src { display: block; }
  body.source #ed { display: none; }
  body.source #bar button:not([data-keep]) { opacity: .35; pointer-events: none; }

  #ed h1 { font-size: 1.6em; margin: .6em 0 .3em; }
  #ed h2 { font-size: 1.3em; margin: .6em 0 .3em; }
  #ed h3 { font-size: 1.1em; margin: .6em 0 .3em; }
  #ed p { margin: .4em 0; }
  #ed blockquote { border-left: 3px solid var(--line); margin: .6em 0; padding-left: 12px; color: var(--muted); }
  #ed a { color: var(--btn-on); }
  #ed img { max-width: 100%; height: auto; vertical-align: bottom; border-radius: 4px; }
  #ed img[data-qn]:not([src]) { min-width: 6em; min-height: 4em; border: 1px dashed var(--line); }
  #imgbox {
    position: absolute; display: none; pointer-events: none; z-index: 1;
    border: 2px solid var(--btn-on); border-radius: 4px; box-sizing: border-box;
  }
  #imgbar {
    position: absolute; display: none; z-index: 3; gap: 4px; padding: 4px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  #imgbar button {
    min-width: 40px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--btn); color: var(--fg); font: 600 14px system-ui, Roboto, sans-serif;
  }
  #imgbar button.on { background: var(--btn-on); color: var(--btn-on-fg); border-color: var(--btn-on); }
  #bar button.open { border-color: var(--btn-on); box-shadow: inset 0 -3px 0 var(--btn-on); }
  .a-color { border-bottom: 3px solid #d64545; padding: 0 2px; }
  .a-hl { background: rgba(255,214,0,.55); padding: 0 3px; border-radius: 3px; }
  #pop {
    position: fixed; left: 8px; right: 8px; z-index: 4; display: none;
    padding: 10px; background: var(--bar); color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.28);
    font: 14px system-ui, Roboto, sans-serif;
  }
  #pop .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #pop .row + .row { margin-top: 10px; }
  #pop .lbl { width: 100%; font-size: 12px; color: var(--muted); margin: 0 0 -2px; }
  #pop button {
    min-width: 40px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--btn); color: var(--fg); font: 600 15px system-ui, Roboto, sans-serif;
  }
  #pop button.sw { width: 40px; min-width: 40px; padding: 0; border-radius: 50%; }
  #pop button.on { background: var(--btn-on); color: var(--btn-on-fg); border-color: var(--btn-on); }
  #pop .msg { color: var(--muted); padding: 6px 2px; }
  #ed table { border-collapse: collapse; margin: .7em 0; display: block; overflow-x: auto; max-width: 100%; }
  #ed th, #ed td { border: 1px solid var(--line); padding: 6px 9px; min-width: 3.5em; vertical-align: top; }
  #ed th { background: var(--th); text-align: left; }
  #ed hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
</style>
</head>
<body>
<div id="bar">
  <button data-cmd="undo" aria-label="Undo">↶</button>
  <button data-cmd="redo" aria-label="Redo">↷</button>
  <span class="sep"></span>
  <button data-block="h1">H1</button>
  <button data-block="h2">H2</button>
  <button data-block="h3">H3</button>
  <button data-block="p" aria-label="Normal text">¶</button>
  <span class="sep"></span>
  <button data-cmd="bold" data-state="bold"><b>B</b></button>
  <button data-cmd="italic" data-state="italic"><i>I</i></button>
  <button data-cmd="underline" data-state="underline"><u>U</u></button>
  <button data-cmd="strikeThrough" data-state="strikeThrough"><s>S</s></button>
  <button data-pop="color" aria-label="Text color"><span class="a-color">A</span></button>
  <button data-pop="hilite" aria-label="Highlight"><span class="a-hl">ab</span></button>
  <button data-pop="font" aria-label="Font and size">Aa</button>
  <span class="sep"></span>
  <button data-cmd="insertUnorderedList" data-state="insertUnorderedList" aria-label="Bullet list">• List</button>
  <button data-cmd="insertOrderedList" data-state="insertOrderedList" aria-label="Numbered list">1. List</button>
  <button data-block="blockquote" aria-label="Quote">❝</button>
  <span class="sep"></span>
  <button data-act="table">⊞ Table</button>
  <button data-act="rowAdd">+ Row</button>
  <button data-act="colAdd">+ Col</button>
  <button data-act="rowDel">− Row</button>
  <button data-act="colDel">− Col</button>
  <button data-pop="shade" aria-label="Shade table cells">▦ Shade</button>
  <span class="sep"></span>
  <button data-act="image">🖼 Image</button>
  <button data-act="link">🔗 Link</button>
  <button data-act="hr" aria-label="Divider">―</button>
  <button data-cmd="removeFormat" aria-label="Clear formatting">⌫ Fmt</button>
</div>
<div id="ed" contenteditable="true" spellcheck="true"></div>
<div id="pop"></div>
<div id="imgbox"></div>
<div id="imgbar">
  <button data-w="33%">S</button>
  <button data-w="66%">M</button>
  <button data-w="">Full</button>
  <button data-w="del" aria-label="Remove image">✕ Remove</button>
</div>
<textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>

<script>
(function () {
  var ed = document.getElementById('ed');
  var src = document.getElementById('src');
  var bar = document.getElementById('bar');
  var sourceMode = false;
  var savedRange = null;
  var imgCache = {};     // image id -> data: URL (pictures live in the app, not in the note text)
  var selImg = null;     // image currently tapped, if any
  var imgbox = document.getElementById('imgbox');
  var imgbar = document.getElementById('imgbar');

  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
  try { document.execCommand('styleWithCSS', false, true); } catch (e) {}

  // Colours/fonts chosen in the app's Theme & fonts settings.
  window.setTheme = function (t) {
    var r = document.documentElement.style;
    for (var k in t) {
      if (k === 'scheme') r.colorScheme = t[k];
      else r.setProperty('--' + k, t[k]);
    }
    placeImgBar();
  };

  // The note text keeps only <img data-qn="ID">; the actual picture data is
  // added for display and stripped again before handing HTML back to the app.
  function serialize() {
    var c = ed.cloneNode(true);
    var imgs = c.querySelectorAll('img[data-qn]');
    for (var i = 0; i < imgs.length; i++) imgs[i].removeAttribute('src');
    return c.innerHTML;
  }
  function hydrate() {
    var imgs = ed.querySelectorAll('img[data-qn]');
    for (var i = 0; i < imgs.length; i++) {
      var u = imgCache[imgs[i].getAttribute('data-qn')];
      if (u && imgs[i].getAttribute('src') !== u) imgs[i].setAttribute('src', u);
    }
  }

  function current() { return sourceMode ? src.value : serialize(); }

  function notify() {
    if (window.Android && Android.onChange) Android.onChange(current());
    updateState();
  }

  window.setContent = function (html) {
    hideImgBar();
    ed.innerHTML = html || '';
    ensureTrailingLine();
    hydrate();
    src.value = serialize();
    updateState();
  };

  window.loadImages = function (map) {
    for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) imgCache[k] = map[k];
    hydrate();
  };

  window.insertImage = function (id, dataUri) {
    imgCache[id] = dataUri;
    if (sourceMode) window.toggleSource();
    ed.focus();
    var s = window.getSelection();
    s.removeAllRanges();
    if (savedRange && ed.contains(savedRange.startContainer)) {
      s.addRange(savedRange);
    } else {
      var r = document.createRange();
      r.selectNodeContents(ed);
      r.collapse(false);
      s.addRange(r);
    }
    document.execCommand('insertHTML', false, '<img data-qn="' + id + '" src="' + dataUri + '">');
    hydrate();   // in case the browser dropped the src while inserting
    saveSel();
    notify();
  };
  window.getContent = current;

  window.toggleSource = function () {
    hideImgBar();
    hidePop();
    if (sourceMode) {
      ed.innerHTML = src.value;
      ensureTrailingLine();
      hydrate();
      sourceMode = false;
      document.body.classList.remove('source');
      ed.focus();
    } else {
      src.value = serialize();
      sourceMode = true;
      document.body.classList.add('source');
      src.focus();
    }
    notify();
  };

  ed.addEventListener('input', function () { hideImgBar(); ensureTrailingLine(); notify(); });
  src.addEventListener('input', notify);

  // ---- selection helpers ----
  function saveSel() {
    var s = window.getSelection();
    if (s.rangeCount && ed.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
  }
  function restoreSel() {
    ed.focus();
    if (savedRange) {
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(savedRange);
    }
  }
  document.addEventListener('selectionchange', function () { saveSel(); updateState(); });

  function cellAtCaret() {
    var s = window.getSelection();
    var n = s.rangeCount ? s.anchorNode : null;
    if (!n && savedRange) n = savedRange.startContainer;
    if (!n || !ed.contains(n)) return null;
    if (n.nodeType === 3) n = n.parentNode;
    return n.closest ? n.closest('td,th') : null;
  }

  function placeCaret(el) {
    var r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(true);
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }

  // ---- getting out of tables ----
  // A table (or divider) at the very end of a note would leave nowhere for the
  // cursor to go below it, so keep an empty line after it.
  var NEEDS_LINE_AFTER = /^(TABLE|HR)$/;
  function isBlank(n) {
    return !n.textContent.replace(/[\s​]/g, '') && !(n.tagName === 'IMG' || (n.querySelector && n.querySelector('img')));
  }
  function lastBlock() {
    for (var n = ed.lastChild; n; n = n.previousSibling) {
      if (n.nodeType === 1) return n;
      if (n.nodeType === 3 && n.textContent.trim()) return null;
    }
    return null;
  }
  function ensureLineAfter(node) {
    var next = node.nextElementSibling;
    if (next && !NEEDS_LINE_AFTER.test(next.tagName)) return next;
    var line = document.createElement('p');
    line.appendChild(document.createElement('br'));
    node.parentNode.insertBefore(line, node.nextSibling);
    return line;
  }
  function ensureTrailingLine() {
    var b = lastBlock();
    if (b && NEEDS_LINE_AFTER.test(b.tagName)) ensureLineAfter(b);
  }
  function caretToEnd(node) {
    var r = document.createRange();
    r.selectNodeContents(node);
    r.collapse(false);
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }
  function caretAtCellEnd(cell) {
    var s = window.getSelection();
    if (!s.rangeCount || !s.isCollapsed) return false;
    var r = s.getRangeAt(0);
    var rest = document.createRange();
    rest.setStart(r.endContainer, r.endOffset);
    rest.setEnd(cell, cell.childNodes.length);
    var frag = rest.cloneContents();
    return !frag.textContent.replace(/[\s​]/g, '') && !frag.querySelector('img');
  }
  function lastLineEmpty(cell) {
    if (isBlank(cell)) return true;
    return /\n[ \t ​]*$/.test(cell.innerText);
  }
  // Drops empty lines at the end of a cell (the one Enter just made).
  function trimCell(cell) {
    for (var n = cell.lastChild; n; n = cell.lastChild) {
      if ((n.nodeType === 3 && !n.textContent.replace(/[\s​]/g, '')) ||
          (n.nodeType === 1 && (n.tagName === 'BR' || (n.tagName !== 'IMG' && isBlank(n))))) {
        cell.removeChild(n);
      } else {
        break;
      }
    }
    if (!cell.firstChild) cell.appendChild(document.createElement('br'));
  }
  // Enter on an empty line in a cell: go to the cell below, or out of the
  // table from the last row.
  function leaveCell(cell) {
    trimCell(cell);
    var tr = cell.parentNode, table = tr.closest('table');
    var next = table.rows[tr.rowIndex + 1];
    if (next) caretToEnd(next.cells[Math.min(cell.cellIndex, next.cells.length - 1)]);
    else placeCaret(ensureLineAfter(table));
    saveSel();
    notify();
  }
  ed.addEventListener('beforeinput', function (e) {
    if (e.inputType !== 'insertParagraph' && e.inputType !== 'insertLineBreak') return;
    var cell = cellAtCaret();
    if (!cell || !caretAtCellEnd(cell) || !lastLineEmpty(cell)) return;
    e.preventDefault();
    leaveCell(cell);
  });
  // Tapping the empty space below the note puts the cursor on its last line.
  ed.addEventListener('click', function (e) {
    if (e.target !== ed) return;
    var b = lastBlock();
    if (!b || e.clientY <= b.getBoundingClientRect().bottom) return;
    ensureTrailingLine();
    caretToEnd(lastBlock());
    saveSel();
    updateState();
  });

  function emptyCell(tag) {
    var c = document.createElement(tag);
    c.appendChild(document.createElement('br'));
    return c;
  }

  // ---- table actions ----
  var acts = {
    table: function () {
      var cols = 3, rows = 3, h = '<table><thead><tr>';
      for (var c = 0; c < cols; c++) h += '<th>Heading</th>';
      h += '</tr></thead><tbody>';
      for (var r = 0; r < rows - 1; r++) {
        h += '<tr>';
        for (var c2 = 0; c2 < cols; c2++) h += '<td><br></td>';
        h += '</tr>';
      }
      h += '</tbody></table><p><br></p>';
      document.execCommand('insertHTML', false, h);
    },
    rowAdd: function () {
      var cell = cellAtCaret(); if (!cell) return hint();
      var tr = cell.parentNode, table = tr.closest('table');
      var n = tr.cells.length, row = document.createElement('tr');
      for (var i = 0; i < n; i++) row.appendChild(emptyCell('td'));
      if (tr.parentNode.tagName === 'THEAD') {
        var body = table.tBodies[0] || table.appendChild(document.createElement('tbody'));
        body.insertBefore(row, body.firstChild);
      } else {
        tr.parentNode.insertBefore(row, tr.nextSibling);
      }
      placeCaret(row.cells[0]);
    },
    colAdd: function () {
      var cell = cellAtCaret(); if (!cell) return hint();
      var idx = cell.cellIndex, table = cell.closest('table');
      for (var i = 0; i < table.rows.length; i++) {
        var tr = table.rows[i];
        var tag = tr.parentNode.tagName === 'THEAD' ? 'th' : 'td';
        var ref = tr.cells[idx + 1] || null;
        tr.insertBefore(emptyCell(tag), ref);
      }
      placeCaret(cell.parentNode.cells[idx + 1]);
    },
    rowDel: function () {
      var cell = cellAtCaret(); if (!cell) return hint();
      var tr = cell.parentNode, table = tr.closest('table');
      if (table.rows.length <= 1) { table.remove(); return; }
      var idx = cell.cellIndex, ri = tr.rowIndex;
      tr.remove();
      var next = table.rows[Math.min(ri, table.rows.length - 1)];
      placeCaret(next.cells[Math.min(idx, next.cells.length - 1)]);
    },
    colDel: function () {
      var cell = cellAtCaret(); if (!cell) return hint();
      var idx = cell.cellIndex, table = cell.closest('table');
      if (table.rows[0].cells.length <= 1) { table.remove(); return; }
      var row = cell.parentNode;
      for (var i = 0; i < table.rows.length; i++) {
        var c = table.rows[i].cells[idx];
        if (c) c.remove();
      }
      placeCaret(row.cells[Math.min(idx, row.cells.length - 1)]);
    },
    link: function () {
      var url = window.prompt('Link address', 'https://');
      restoreSel();
      if (!url || url === 'https://') return;
      var s = window.getSelection();
      if (s.isCollapsed) {
        var a = document.createElement('a');
        a.href = url; a.textContent = url;
        document.execCommand('insertHTML', false, a.outerHTML + '&nbsp;');
      } else {
        document.execCommand('createLink', false, url);
      }
    },
    hr: function () { document.execCommand('insertHorizontalRule'); },
    image: function () {
      saveSel();
      if (window.Android && Android.pickImage) Android.pickImage();
    }
  };

  // ---- tapping an image: S / M / Full / Remove ----
  function placeImgBar() {
    if (!selImg || !ed.contains(selImg)) return hideImgBar();
    var r = selImg.getBoundingClientRect();
    var x = r.left + window.scrollX, y = r.top + window.scrollY;
    imgbox.style.left = x + 'px'; imgbox.style.top = y + 'px';
    imgbox.style.width = r.width + 'px'; imgbox.style.height = r.height + 'px';
    imgbox.style.display = 'block';
    imgbar.style.display = 'flex';
    var bw = imgbar.offsetWidth, bh = imgbar.offsetHeight;
    var left = Math.max(8, Math.min(x + r.width / 2 - bw / 2, window.scrollX + document.documentElement.clientWidth - bw - 8));
    var top = y + Math.min(r.height, 120) - bh - 8;
    if (top < window.scrollY + bar.offsetHeight + 4) top = y + 8;
    imgbar.style.left = left + 'px'; imgbar.style.top = top + 'px';
    var w = selImg.style.width || '';
    var bs = imgbar.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].dataset.w === w);
  }
  function hideImgBar() {
    selImg = null;
    imgbox.style.display = 'none';
    imgbar.style.display = 'none';
  }

  ed.addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG') {
      selImg = e.target;
      // Put the caret just after the image so typing continues there.
      var r = document.createRange();
      r.setStartAfter(selImg);
      r.collapse(true);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      saveSel();
      placeImgBar();
    } else {
      hideImgBar();
    }
  });
  window.addEventListener('resize', placeImgBar);
  imgbar.addEventListener('mousedown', function (e) { e.preventDefault(); });
  imgbar.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  imgbar.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !selImg) return;
    var w = b.dataset.w;
    if (w === 'del') {
      selImg.remove();
      hideImgBar();
    } else {
      selImg.removeAttribute('width');
      selImg.removeAttribute('height');
      selImg.style.width = w;
      if (!selImg.getAttribute('style')) selImg.removeAttribute('style');
      placeImgBar();
    }
    notify();
  });

  function hint() {
    var old = ed.getAttribute('data-hint');
    if (old) return;
    var b = bar.querySelector('[data-act="rowAdd"]');
    b.textContent = 'Tap a cell first';
    ed.setAttribute('data-hint', '1');
    setTimeout(function () { b.textContent = '+ Row'; ed.removeAttribute('data-hint'); }, 1500);
  }

  // ---- per-note colours, fonts and cell shading ----
  // Colours are chosen to stay readable in both light and dark themes.
  var TEXT_COLORS = [['Red', '#d64545'], ['Orange', '#d9822b'], ['Gold', '#b8961e'], ['Green', '#3b9a5b'],
                     ['Teal', '#2a9d9d'], ['Blue', '#3d7fd6'], ['Purple', '#8a5cd1'], ['Gray', '#8a8a8a']];
  var HILITES = [['Yellow', 'rgba(255, 214, 0, 0.4)'], ['Green', 'rgba(80, 200, 120, 0.35)'],
                 ['Blue', 'rgba(80, 160, 255, 0.35)'], ['Pink', 'rgba(255, 100, 160, 0.35)'],
                 ['Orange', 'rgba(255, 150, 50, 0.38)'], ['Purple', 'rgba(160, 110, 255, 0.35)']];
  var SHADES = [['Gray', 'rgba(128, 128, 128, 0.2)'], ['Yellow', 'rgba(255, 214, 0, 0.25)'],
                ['Green', 'rgba(80, 200, 120, 0.22)'], ['Blue', 'rgba(80, 160, 255, 0.22)'],
                ['Pink', 'rgba(255, 100, 160, 0.22)'], ['Orange', 'rgba(255, 150, 50, 0.25)'],
                ['Purple', 'rgba(160, 110, 255, 0.22)']];
  var FONTS = [['Sans', 'system-ui, Roboto, sans-serif'], ['Serif', "'Noto Serif', Georgia, serif"],
               ['Mono', "'Roboto Mono', 'Droid Sans Mono', monospace"], ['Script', 'cursive']];
  var SIZES = [['S', '2'], ['Normal', ''], ['L', '4'], ['XL', '5']];
  var INLINE = /^(SPAN|FONT|B|STRONG|I|EM|U|S|STRIKE|A|SUB|SUP|MARK)$/;
  var pop = document.getElementById('pop');
  var popKind = null, popBtn = null, shadeScope = 'row';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function swatch(name, color, act) {
    var b = el('button', 'sw');
    b.style.background = color;
    b.setAttribute('aria-label', name);
    b.dataset.v = act;
    return b;
  }
  function plainBtn(label, act, on) {
    var b = el('button', on ? 'on' : '', label);
    b.dataset.v = act;
    return b;
  }

  function buildPop(kind) {
    pop.innerHTML = '';
    var row = el('div', 'row');
    if (kind === 'color') {
      TEXT_COLORS.forEach(function (c) { row.appendChild(swatch(c[0], c[1], 'fc:' + c[1])); });
      row.appendChild(plainBtn('Default', 'fc:'));
      pop.appendChild(row);
    } else if (kind === 'hilite') {
      HILITES.forEach(function (c) { row.appendChild(swatch(c[0], c[1], 'hl:' + c[1])); });
      row.appendChild(plainBtn('None', 'hl:'));
      pop.appendChild(row);
    } else if (kind === 'font') {
      row.appendChild(el('div', 'lbl', 'Font'));
      FONTS.forEach(function (f) {
        var b = plainBtn(f[0], 'ff:' + f[1]);
        b.style.fontFamily = f[1];
        row.appendChild(b);
      });
      row.appendChild(plainBtn('Default', 'ff:'));
      pop.appendChild(row);
      var row2 = el('div', 'row');
      row2.appendChild(el('div', 'lbl', 'Size'));
      SIZES.forEach(function (z) { row2.appendChild(plainBtn(z[0], 'fs:' + z[1])); });
      pop.appendChild(row2);
    } else if (kind === 'shade') {
      if (!cellAtCaret()) {
        pop.appendChild(el('div', 'msg', 'Tap inside a table cell first, then choose a color.'));
        return;
      }
      row.appendChild(el('div', 'lbl', 'Apply to'));
      [['Cell', 'cell'], ['Row', 'row'], ['Column', 'col']].forEach(function (o) {
        row.appendChild(plainBtn(o[0], 'scope:' + o[1], shadeScope === o[1]));
      });
      pop.appendChild(row);
      var row3 = el('div', 'row');
      SHADES.forEach(function (c) { row3.appendChild(swatch(c[0], c[1], 'sh:' + c[1])); });
      row3.appendChild(plainBtn('None', 'sh:'));
      row3.appendChild(plainBtn('✓ Done', 'done:'));
      pop.appendChild(row3);
    }
  }

  function togglePop(kind, btn) {
    if (popKind === kind) return hidePop();
    hidePop();
    hideImgBar();
    popKind = kind;
    popBtn = btn;
    btn.classList.add('open');
    buildPop(kind);
    pop.style.top = (bar.getBoundingClientRect().bottom + 6) + 'px';
    pop.style.display = 'block';
  }
  function hidePop() {
    if (popBtn) popBtn.classList.remove('open');
    popKind = null;
    popBtn = null;
    pop.style.display = 'none';
  }

  function unwrap(node) {
    var parent = node.parentNode;
    while (node.firstChild) parent.insertBefore(node.firstChild, node);
    parent.removeChild(node);
  }

  // Removes one style (e.g. colour) from the selected text, leaving other formatting alone.
  function clearStyle(prop) {
    var s = window.getSelection();
    if (!s.rangeCount) return;
    var r = s.getRangeAt(0);
    var root = r.commonAncestorContainer;
    if (root.nodeType === 3) root = root.parentNode;
    var list = [];
    for (var a = root; a && a !== ed; a = a.parentNode) list.push(a);
    var inner = root.querySelectorAll ? root.querySelectorAll('*') : [];
    for (var i = 0; i < inner.length; i++) if (r.intersectsNode(inner[i])) list.push(inner[i]);
    list.forEach(function (n) {
      if (!INLINE.test(n.tagName)) return;
      if (n.style && n.style[prop]) {
        n.style[prop] = '';
        if (!n.getAttribute('style')) n.removeAttribute('style');
      }
      if (n.tagName === 'FONT') {
        if (prop === 'color') n.removeAttribute('color');
        if (prop === 'fontFamily') n.removeAttribute('face');
        if (prop === 'fontSize') n.removeAttribute('size');
      }
      if ((n.tagName === 'SPAN' || n.tagName === 'FONT') && n.attributes.length === 0 && n.parentNode) unwrap(n);
    });
  }

  function shadeCells(color) {
    var cell = cellAtCaret();
    if (!cell) return;
    var table = cell.closest('table');
    var cells = [];
    if (shadeScope === 'row') {
      cells = Array.prototype.slice.call(cell.parentNode.cells);
    } else if (shadeScope === 'col') {
      for (var i = 0; i < table.rows.length; i++) {
        var c = table.rows[i].cells[cell.cellIndex];
        if (c) cells.push(c);
      }
    } else {
      cells = [cell];
    }
    cells.forEach(function (c) {
      c.style.backgroundColor = color;
      if (!c.getAttribute('style')) c.removeAttribute('style');
    });
  }

  pop.addEventListener('mousedown', function (e) { e.preventDefault(); });
  pop.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  pop.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var v = b.dataset.v, i = v.indexOf(':');
    var kind = v.slice(0, i), val = v.slice(i + 1);
    if (kind === 'done') return hidePop();
    restoreSel();
    if (kind === 'scope') {
      shadeScope = val;
      buildPop('shade');
      return;
    }
    if (kind === 'fc') { if (val) document.execCommand('foreColor', false, val); else clearStyle('color'); }
    else if (kind === 'hl') { if (val) document.execCommand('hiliteColor', false, val); else clearStyle('backgroundColor'); }
    else if (kind === 'ff') { if (val) document.execCommand('fontName', false, val); else clearStyle('fontFamily'); }
    else if (kind === 'fs') { if (val) document.execCommand('fontSize', false, val); else clearStyle('fontSize'); }
    else if (kind === 'sh') { shadeCells(val); }
    saveSel();
    notify();
    if (kind !== 'sh') hidePop();
  });
  ed.addEventListener('click', hidePop);
  ed.addEventListener('input', hidePop);

  // ---- toolbar ----
  // Stop the buttons from stealing focus (which would close the keyboard
  // and lose the selection).
  bar.addEventListener('mousedown', function (e) { e.preventDefault(); });
  bar.addEventListener('pointerdown', function (e) { if (e.target.closest('button')) e.preventDefault(); });

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || sourceMode) return;
    restoreSel();
    if (b.dataset.cmd) {
      document.execCommand(b.dataset.cmd, false, null);
    } else if (b.dataset.block) {
      var tag = b.dataset.block;
      var cur = (document.queryCommandValue('formatBlock') || '').toLowerCase();
      document.execCommand('formatBlock', false, cur === tag && tag !== 'p' ? 'p' : tag);
    } else if (b.dataset.act && acts[b.dataset.act]) {
      acts[b.dataset.act]();
    } else if (b.dataset.pop) {
      saveSel();
      togglePop(b.dataset.pop, b);
      return;
    }
    hidePop();
    saveSel();
    notify();
  });

  function updateState() {
    var btns = bar.querySelectorAll('[data-state]');
    for (var i = 0; i < btns.length; i++) {
      var on = false;
      try { on = document.queryCommandState(btns[i].dataset.state); } catch (e) {}
      btns[i].classList.toggle('on', !!on);
    }
    var block = '';
    try { block = (document.queryCommandValue('formatBlock') || '').toLowerCase(); } catch (e) {}
    var bb = bar.querySelectorAll('[data-block]');
    for (var j = 0; j < bb.length; j++) bb[j].classList.toggle('on', bb[j].dataset.block === block && block !== 'p');
  }
})();
</script>
</body>
</html>
